version: 2
updates:
  # Bun repo: npm ecosystem updates package.json but not bun.lock.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: "production"
        patterns:
          - "express"
          - "axios"
          - "zod"
          - "jsonwebtoken"
          - "@modelcontextprotocol/*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      linting:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
