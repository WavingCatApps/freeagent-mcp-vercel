version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: "production"
        patterns:
          - "express"
          - "axios"
          - "zod"
          - "jsonwebtoken"
          - "@modelcontextprotocol/*"
      typescript:
        patterns:
          - "typescript"
          - "@typescript/native"
          - "@types/*"
      linting:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
      deployment:
        patterns:
          - "@vercel/*"
    # TypeScript 7 has no Compiler API yet (expected in 7.1), so tooling that
    # imports `typescript` (typescript-eslint, @vercel/node) must stay on 6.x.
    # Native TS 7 builds are installed via the `@typescript/native` alias.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
